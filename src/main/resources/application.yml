spring:
  application:
    name: ivedi-kurye-management

  datasource:
    url: jdbc:postgresql://localhost:5433/kurye_dispatch_db
    username: kurye
    password: kurye
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

realtime:
  redis:
    enabled: false  # Redis pub/sub — set to true when Redis is running
  websocket:
    allowed-origins: "http://localhost:3000,http://localhost:5173"

application:
  security:
    jwt:
      secret-key: dGhpcy1pcy1hLXZlcnktc2VjcmV0LWtleS10aGF0LW11c3QtYmUtY2hhbmdlZA==
      expiration: 86400000

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

server:
  port: 8080

logging:
  level:
    com:
      ivedi: DEBUG
    org:
      springframework:
        security: INFO
      flywaydb: INFO
